<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Sierpinski</title>
    <script type="module" src="index.js"></script>
    <link rel="stylesheet" href="index.css" type="text/css" />
    <link rel="stylesheet" href="scrollbar.css" type="text/css" />
</head>
<body>


<div class="window main">
    <div class="window_in">
        <div class="titlebar">
            <img src="controls.png" class="control"/>
            Sierpinski Generator
        </div>
        <div class="body">
            <div class="frame">
                <div class="frame_in toolbar">
                    <h2>Shape</h2>
                    <div class="button_group">
                        <button id="less"><div><span>-</span></div></button>
                        <span id="sides">7</span> Sides
                        <button id="more"><div><span>+</span></div></button>
                    </div>
                    <div class="button_group">
                        <button id="centre" class="checkbox"><div></div></button>
                        <label for="centre">Add Centre point</label>
                    </div>
                </div>
            </div>

            <div class="panel">
                <canvas class="panel_in" id="sierp" width="400" height="400">
                    A modern browser is required to view the Sierpinski generator
                </canvas>
                <div id="loading" class="hidden">Loading</div>
            </div>

            <div class="frame">
                <div class="frame_in">
                    <h2>Steps</h2>
                    <button id="auto"><div><span>Run</span></div></button>
                    <button id="next"><div><span>Step 1</span></div></button>
                    <button id="clear"><div><span>Clear</span></div></button> &nbsp;
                    <button id="save"><div><span>Save</span></div></button>

                </div>
            </div>
        </div>
    </div>
</div>

<div class="window results">
    <div class="window_in">
        <div class="titlebar">
            <img src="controls.png" class="control"/>
            Results
        </div>
        <div class="body">
            <button disabled="disabled" id="reset_icons">
                <div><span>Reset</span></div>
            </button>
            <div class="panel icon_list">
                <div class="panel_in">

                </div>
            </div>
        </div>
    </div>
</div>


</body>
</html>
